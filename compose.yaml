services:
  kafka:
    image: apache/kafka:3.9.1
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_HOURS: "168"
      KAFKA_LOG_RETENTION_BYTES: "1073741824"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  postgres:
    image: postgres:16.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-observatorio}
      POSTGRES_USER: ${POSTGRES_USER:-observatorio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copia .env.example a .env y define una clave local}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  productor:
    # PLACEHOLDER: reemplazar por la imagen/comando del productor USGS (pendiente).
    image: python:3.12-slim
    restart: "no"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    command: ["python", "-c", "raise SystemExit('PENDIENTE: implementar productor USGS')"]
    depends_on:
      kafka:
        condition: service_healthy

  consumidor:
    # PLACEHOLDER: reemplazar por la imagen/comando del consumidor (pendiente).
    image: python:3.12-slim
    restart: "no"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-observatorio}
      PGUSER: ${POSTGRES_USER:-observatorio}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Copia .env.example a .env y define una clave local}
    command: ["python", "-c", "raise SystemExit('PENDIENTE: implementar consumidor')"]
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy

  api:
    # PLACEHOLDER: reemplazar por la imagen/comando de FastAPI (pendiente).
    image: python:3.12-slim
    restart: "no"
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-observatorio}
      PGUSER: ${POSTGRES_USER:-observatorio}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Copia .env.example a .env y define una clave local}
      UVICORN_HOST: 0.0.0.0
      UVICORN_PORT: "8000"
    command: ["python", "-c", "raise SystemExit('PENDIENTE: implementar API FastAPI')"]
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  kafka_data:
  postgres_data:
